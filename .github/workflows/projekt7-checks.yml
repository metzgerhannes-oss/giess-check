name: Projekt 7 automated checks
on:
  push:
    branches: [main, feature/projekt7-ueberraschung]
    paths:
      - "projekt7/**"
      - ".github/workflows/projekt7-checks.yml"
  pull_request:
    paths:
      - "projekt7/**"
      - ".github/workflows/projekt7-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mandatory gate - all JS syntax, Node regressions, offline assets and safety
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find projekt7 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          node --test projekt7/test/*.test.mjs
          python3 projekt7/test/check_assets.py

  browser_milestone:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[milestone]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Headless Chromium mobile and offline smoke
        run: node projekt7/test/browser-smoke.mjs

  deployed_https:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deployed HTTPS assets against exact commit
        env:
          PAGES_URL: https://metzgerhannes-oss.github.io/giess-check/projekt7/
        run: node projekt7/test/live-smoke.mjs
