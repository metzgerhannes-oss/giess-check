name: Projekt 7 automated checks
on:
  push:
    branches: [main, feature/projekt7-ueberraschung]
    paths:
      - "projekt7/**"
      - ".github/workflows/projekt7-checks.yml"
  pull_request:
    paths:
      - "projekt7/**"
      - ".github/workflows/projekt7-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests
        run: node --test projekt7/test/*.test.mjs
      - name: JavaScript syntax
        run: |
          node --check projekt7/core.mjs
          node --check projekt7/storage.mjs
          node --check projekt7/history.mjs
          node --check projekt7/archive.mjs
          node --check projekt7/backup.mjs
          node --check projekt7/app.mjs
          node --check projekt7/sw.js
      - name: HTML, PWA asset references
        run: python3 projekt7/test/check_assets.py

  browser_milestone:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[milestone]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Headless Chromium mobile and offline smoke
        run: node projekt7/test/browser-smoke.mjs
